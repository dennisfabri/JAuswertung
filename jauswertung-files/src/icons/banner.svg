  <rect x="7.85" y="14.6" width="3" height="6.2" rx="0.4" fill="#dde2f8"/>
  <rect x="11.1" y="17" width="3" height="3.8" rx="0.4" fill="#98a9ea"/>
  <g fill="#1a3fd1" font-family="Quicksand" font-weight="700" font-size="2.2" text-anchor="middle">
  <text x="6.1" y="20.281">2</text>
  <text x="9.35" y="20.281">1</text>
  <text x="12.6" y="20.281">3</text>
  </g>
  </g>
  <text x="85.6" y="40.9" font-family="Quicksand" font-weight="700" font-size="52" fill="#1a3fd1">JAuswertung</text>
