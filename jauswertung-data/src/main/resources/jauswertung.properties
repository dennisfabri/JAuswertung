ShowHeats.Note=<html><body>Der Wechsel zum n&auml;chsten Lauf wird durch folgende Tasten durchgef&uuml;hrt:<br/><br/>&nbsp;&nbsp;&nbsp;&nbsp;&lt;Bild Runter&gt;<br/>&nbsp;&nbsp;&nbsp;&nbsp;&lt;Cursor Runter&gt;<br/>&nbsp;&nbsp;&nbsp;&nbsp;&lt;Cursor Rechts&gt;<br/>&nbsp;&nbsp;&nbsp;&nbsp;&lt;Enter&gt;<br/>&nbsp;&nbsp;&nbsp;&nbsp;&lt;Leertaste&gt;<br/><br/>Der Wechsel zum vorherigen Lauf wird durch folgende Tasten durchgef&uuml;hrt:<br/><br/>&nbsp;&nbsp;&nbsp;&nbsp;&lt;Bild Hoch&gt;<br/>&nbsp;&nbsp;&nbsp;&nbsp;&lt;Cursor Hoch&gt;<br/>&nbsp;&nbsp;&nbsp;&nbsp;&lt;Cursor Links&gt;<br/>&nbsp;&nbsp;&nbsp;&nbsp;&lt;Backspace&gt;<br/><br/>Dar&uuml;ber hinaus sind folgende Funktionen verf&uuml;gbar:<br/><br/>&nbsp;&nbsp;&nbsp;&nbsp;1: Schaltet Vollbild im ersten Monitor an bzw. aus<br/>&nbsp;&nbsp;&nbsp;&nbsp;2: Schaltet Vollbild im zweiten Monitor an bzw. aus<br/>&nbsp;&nbsp;&nbsp;&nbsp;F: Schaltet Vollbild auf dem aktuellen Monitor an bzw. aus<br/>&nbsp;&nbsp;&nbsp;&nbsp;I: Schaltet zwischen Schwarz-Wei&szlig; und Wei&szlig;-Schwarz um<br/>&nbsp;&nbsp;&nbsp;&nbsp;M: Spiegelt die Anzeige<br/>&nbsp;&nbsp;&nbsp;&nbsp;S: Schaltet zwischen der ersten und zweiten Seite um.<br/>&nbsp;&nbsp;&nbsp;&nbsp;F11: Schaltet Vollbild auf dem aktuellen Monitor an bzw. aus<br/>&nbsp;&nbsp;&nbsp;&nbsp;&lt;Escape&gt;: Schlie&szlig;t das Fentster<br/><br/>Mit der linken bzw. rechten Maustaste kann ebenfalls zwischen den L&auml;ufen gewechselt werden.</body></html>
