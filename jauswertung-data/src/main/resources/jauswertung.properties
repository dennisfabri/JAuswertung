Documents.Help=<html><body>Folgende Textelemente werden beim Urkundendruck automatisch ersetzt:<br><br><table border="0"><tr><td>&lt;Name&gt;</td><td>Name des Schwimmers/der Mannschaft</td></tr><tr><td>&lt;Gliederung&gt;</td><td>Gliederung</td></tr><tr><td>&lt;Altersklasse&gt;</td><td>Altersklasse</td></tr><tr><td>&lt;Geschlecht&gt;</td><td>Geschlecht</td></tr><tr><td>&lt;Platz&gt;</td><td>Erreichter Platz</td></tr><tr><td>&lt;Punkte&gt;</td><td>Erreichte Punkte</td></tr><tr><td>&lt;Wertung&gt;</td><td>Angabe zur Wertung.<br>Diese wird durch "Mehrkampf" bzw. im Falle der Disziplinenwertung von Disziplinen<br>durch den Namen der Disziplin ersetzt.</td></tr><tr><td>&lt;Mitglieder&gt;</td><td>Bei Mannschaftswettk&auml;mpfen wird dieser Eintrag durch die Liste der<br>Mannschaftsmitglieder ersetzt.</td></tr><tr><td>&lt;Mitglieder2&gt;</td><td>Bei Mannschaftswettk&auml;mpfen wird dieser Eintrag durch die Liste der Mannschafts-<br>mitglieder ersetzt. Dabei wird jedes Mitglied in eine Zeile gedruckt.</td></tr><tr><td>&lt;Zeiten1&gt;</td><td>Dieser Eintrag wird mit eine Komma getrennten Liste der Zeiten ersetzt.</td></tr><tr><td>&lt;Zeiten2&gt;</td><td>Dieser Eintrag wird durch die Zeiten ersetzt. Diese werden dabei jeweils in eine<br>Zeile geschrieben.</td></tr><tr><td>&lt;h&gt;</td><td>Dieser Eintrag enthält die Stunden der geschwommenen Zeit.*</td></tr><tr><td>&lt;hh&gt;</td><td>Dieser Eintrag enthält die Stunden der geschwommenen Zeit in zweistelliger Form.*</td></tr><tr><td>&lt;m&gt;</td><td>Dieser Eintrag enthält die Minuten der geschwommenen Zeit.*</td></tr><tr><td>&lt;mm&gt;</td><td>Dieser Eintrag enthält die Minuten der geschwommenen Zeit in zweistelliger Form.*</td></tr><tr><td>&lt;s&gt;</td><td>Dieser Eintrag enthält die Sekunden der geschwommenen Zeit.*</td></tr><tr><td>&lt;ss&gt;</td><td>Dieser Eintrag enthält die Sekunden der geschwommenen Zeit in zweistelliger Form.*</td></tr><tr><td>&lt;s,0&gt;</td><td>Dieser Eintrag enthält die Sekunden mit Zehntelsekunden der geschwommenen Zeit.*</td></tr><tr><td>&lt;ss,0&gt;</td><td>Dieser Eintrag enthält die Sekunden mit Zehntelsekunden der geschwommenen Zeit<br>mit Sekunden in zweistelliger Form.*</td></tr><tr><td>&lt;s,00&gt;</td><td>Dieser Eintrag enthält die Sekunden mit Hundertstelsekunden der geschwommenen<br>Zeit.*</td></tr><tr><td>&lt;ss,00&gt;</td><td>Dieser Eintrag enthält die Sekunden mit Hundertstelsekunden der<br>geschwommenen Zeit mit Sekunden in zweistelliger Form.*</td></tr></table><p><br>Der Arbeitsbereich stellt das gesamte Blatt inklusive ggf. nicht bedruckbarer Ränder dar.</p><p><br>* Diese Werte sind nur gefüllt, wenn genau eine Disziplin geschwommen oder die Disziplinenwertung<br>durchgeführt wird.</p></body></html>
